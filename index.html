<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Metadatos básicos de la página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://1000marcas.net/wp-content/uploads/2020/01/logo-F1.png">
    <title>F1</title>
    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="./style/style.css">

</head>

<body>
    <!-- Pantalla inicial con modelo 3D de Sketchfab -->
    <div id="inicio">
        <div class="sketchfab-embed-wrapper">
            <!-- Iframe del modelo 3D -->
            <iframe title="Ferrari SF-25" frameborder="0" allowfullscreen mozallowfullscreen="true"
                webkitallowfullscreen="true" allow="autoplay; fullscreen; xr-spatial-tracking" xr-spatial-tracking
                execution-while-out-of-viewport execution-while-not-rendered web-share width="1920" height="1080"
                src="https://sketchfab.com/models/7929bd7771d8494eaf0eb31404e24bf6/embed?autostart=1&transparent=1">
            </iframe>
            <!-- Pie de info (sin contenido) -->
            <p style="font-size: 13px; font-weight: normal; margin: 5px; color: #4A4A4A;">
                <a href="#" target="_blank" rel="nofollow"></a>
            </p>
        </div>

        <!-- Botón para avanzar al login -->
        <button class="botonInicio" onclick="mostrarOtroContenido()">
            <a class="boton">LOGIN</a>
        </button>
        <!-- Logo de F1 -->
        <img src="./img/f1" alt="F1 Logo" class="f1">
    </div>

    <!-- Pantalla de selección de usuario o administrador -->
    <div id="nuevo-contenido">
        <div class="seleccion-usuario">
            <!-- Opción de usuario -->
            <div class="usuario-opcion">
                <img src="./img/piloto.jpg" alt="Piloto" class="piloto">
                <button class="botonUsuario">Usuario</button>
            </div>
            <!-- Opción de administrador -->
            <div class="admin-opcion">
                <img src="./img/mattia-binotto-team-principal--1.jpg" alt="Administrador" class="administrador">
                <button class="botonAdministrador">Administrador</button>
            </div>
        </div>
        <!-- Botón para volver a la pantalla inicial -->
        <button class="botonVolver" onclick="volver()">Volver</button>
    </div>

    <!-- Vista de usuario (inicialmente oculta) -->
    <div id="vista-usuario" style="display: none;">


        <!-- Encabezado con logo y menú de navegación -->
        <header class="f1-header">
            <div class="logo-container">
                <img src="./img/f1" alt="F1 Logo" class="header-logo">
            </div>
            <nav class="main-nav">
                <ul>
                    <!-- Link para comenzar carrera -->
                    <li><a href="#comenzar-carrera">Comenzar carrera</a></li>
                    <!-- Menú desplegable para información -->
                    <li class="dropdown">
                        <a href="#informacion" class="dropdown-toggle">Información</a>
                        <ul class="dropdown-menu">
                            <!-- Links a las distintas secciones -->
                            <li><a href="#vehiculos" onclick="showSection('vehiculos')">Vehículos</a></li>
                            <li><a href="#pilotos" onclick="showSection('pilotos')">Pilotos</a></li>
                            <li><a href="#circuitos" onclick="showSection('circuitos')">Circuitos</a></li>
                            <li><a href="#equipos" onclick="showSection('equipos')">Equipos</a></li>
                        </ul>
                    </li>
                    <!-- Link de salida -->
                    <li><a href="#" onclick="volver()" class="exit-link">EXIT</a></li>
                </ul>
            </nav>
        </header>

        <!-- Fondo de contenido -->
        <div class="content-background"></div>

        <!-- Contenedor de contenido de usuario -->
        <div class="contenido-usuario">
            <!-- Sección Comenzar Carrera -->
            <section id="comenzar-carrera">
                <h2 class="section-title">Comenzar Carrera</h2>
            </section>

            <!-- Sección Vehículos (inicialmente oculta) -->
            <section id="vehiculos" style="display: none;">
                <div class="section-header">
                    <h2 class="section-title">Vehículos</h2>
                    <div class="section-divider"></div>
                </div>
                <div class="content-placeholder">
                </div>
            </section>

            <!-- Sección Pilotos (inicialmente oculta) -->
            <section id="pilotos" style="display: none;">
                <div class="section-header">
                    <h2 class="section-title">Pilotos</h2>
                    <div class="section-divider"></div>
                </div>
                <div class="content-placeholder">
                    <section id="pilotos">
                        <h2>Pilotos</h2>
                        <!-- Aquí se cargarán los pilotos desde la API -->
                        <div id="lista-pilotos"></div>
                    </section>
                </div>
            </section>

            <!-- Sección Circuitos (inicialmente oculta) -->
            <section id="circuitos" style="display: none;">
                <div class="section-header">
                    <h2 class="section-title">Circuitos</h2>
                    <div class="section-divider"></div>
                </div>
                <div class="content-placeholder">
                    <section id="circuitos">
                        <h2>Circuitos</h2>
                        <!-- Aquí se cargarán los circuitos desde la API -->
                        <div id="lista-circuitos"></div>
                    </section>
                </div>
            </section>
            <!-- Sección Equipos (inicialmente oculta) -->
            <section id="equipos" style="display: none;"> 
                <div class="section-header">
                    <h2 class="section-title">Equipos</h2>
                    <div class="section-divider"></div>
                </div>
                <div class="content-placeholder">
                </div>
            </section>
        </div>
    </div>

    <!-- Vista de administrador (inicialmente oculta) -->
    <div id="vista-admin" style="display: none;">
        <div class="admin-header">
            <div class="logo">
                <img class="logo-container" src="./img/f1" alt="">
            </div>
            <div class="menu">
                <div class="dropdown">
                    <button class="dropbtn">Opciones ▼</button>
                    <div class="dropdown-content">
                        <li><a href="#ADMINvehiculos" onclick="showSection('ADMINvehiculos')">Vehículos</a></li>
                        <li><a href="#ADMINpilotos" onclick="showSection('ADMINpilotos')">Pilotos</a></li>
                        <li><a href="#ADMINcircuitos" onclick="showSection('ADMINcircuitos')">Circuitos</a></li>
                        <li><a href="#ADMINequipos" onclick="showSection('ADMINequipos')">Equipos</a></li>
                        <li><button class="btn-agregar-dropdown" data-tipo="vehiculo">AGvehiculos</button></li>
                        <li><button class="btn-agregar-dropdown" data-tipo="piloto">AGpilotos</button></li>
                        <li><button class="btn-agregar-dropdown" data-tipo="circuito">AGcircuitos</button></li>
                        <li><button class="btn-agregar-dropdown" data-tipo="equipo">AGequipos</button></li>
                    </div>
                </div>
                <button class="exit-btn" onclick="volver()">Exit</button>
            </div>
        </div>
        <!--Contenido de administradr-->
        <div class="contenido-admin">

            <!-- Sección Vehículos (inicialmente oculta) -->
            <section id="ADMINvehiculos" style="display: none;">
                <div class="section-header">
                    <h2 class="section-title">Vehículos</h2>
                    <div class="section-divider"></div>
                </div>
                <div class="content-placeholder">
                </div>
            </section>

            <!-- Sección Pilotos (inicialmente oculta) -->
            <section id="ADMINpilotos" style="display: none;">
                <div class="section-header">
                    <h2 class="section-title">Pilotos</h2>
                    <div class="section-divider"></div>
                </div>
                <div class="content-placeholder">
                </div>
            </section>

            <!-- Sección Circuitos (inicialmente oculta) -->
            <section id="ADMINcircuitos" style="display: none;">
                <div class="section-header">
                    <h2 class="section-title">Circuitos</h2>
                    <div class="section-divider"></div>
                </div>
                <div class="content-placeholder">
                </div>
            </section>
            <!--Seccion Equipos (Inicialmente Oculta)-->
            <section id="ADMINequipos" style="display: none;">
                <div class="section-header">
                    <h2 class="section-title">Equipos</h2>
                    <div class="section-divider"></div>
                </div>
                <div class="content-placeholder">
                </div>
            </section>
        </div>
    </div>

    <div id="modalAgregar" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-modal" id="cerrarModalAgregar">&times;</span>
            <h2 id="modalTitulo"></h2>
            <form id="formAgregar"></form>
        </div>
    </div>

</body>

<!-- Archivos de JavaScript -->
<script src="./scripts/script.js"></script>
<script src="./scripts/inicio.js"></script>
<script src="./scripts/usuario.js"></script>
<script src="./scripts/administrador.js"></script>
<script src="./scripts/infoVehiculos.js"></script>
<script src="./scripts/infoPilotos.js"></script>
<script src="./scripts/infoCircuitos.js"></script>
<script src="./scripts/infoEquipos.js"></script>
<script src="./scripts/circuitos(admin).js"></script>
<script src="./scripts/vehiculos(admin).js"></script>
<script src="./scripts/equipos(admin).js"></script>
<script src="./scripts/pilotos(admin).js"></script>
<script src="./scripts/adminAgregar.js"></script>
</html>
